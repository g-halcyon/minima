// Minima Android app module.
//
// externalNativeBuild compiles the SAME portable C++ core (src/core/ at the repo root)
// into libminima_core.so via the NDK; MainActivity reaches it through MinimaCore (JNI).
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.minima.browser'
    compileSdk 34
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.minima.browser"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "0.9"
        externalNativeBuild { cmake { cppFlags "-std=c++17" } }
        // arm64 for real devices, x86_64 for the emulator; keeps llama.cpp build time sane.
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
